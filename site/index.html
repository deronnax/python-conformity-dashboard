<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$subtitle">
  <title>$title</title>
  <link rel="alternate" hreflang="en" href="${base}index.html">
  <link rel="alternate" hreflang="fr" href="$frenchPage">
  <link rel="stylesheet" href="${base}styles.css?v=$styleVersion">
  <script src="${base}dashboard.js?v=$scriptVersion" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <h1>$title</h1>
        <p>$subtitle</p>
      </div>
      <div class="header-actions">
        <details class="language-control">
          <summary>$language</summary>
          <ul>
            <li><a lang="en" hreflang="en" href="${base}index.html?lang=en" data-language-link$englishCurrent>English</a></li>
            <li><a lang="fr" hreflang="fr" href="$frenchPage?lang=fr" data-language-link$frenchCurrent>Français</a></li>
          </ul>
        </details>
        <a href="${base}results.json" download>$download</a>
        <a href="https://github.com/deronnax/python-conformity-dashboard">$github</a>
      </div>
    </header>
    <p class="metadata">$reference $referenceVersion · $platform · <time datetime="$generatedAt">$timestamp</time></p>

    <section class="comparison" aria-label="$comparison">
      <nav class="switch" aria-label="$suite">
        <a href="#use-cases" data-dashboard-link>$usesTab</a>
        <a href="#shared-cases" data-dashboard-link>$commonTab</a>
        <a href="#cpython-tests" data-dashboard-link>$upstreamTab</a>
      </nav>
      $useCases
      $common
      $upstream
    </section>

    <details class="methodology">
      <summary>$methodology</summary>
      <p>$methodCases</p>
      <p>$methodUpstream</p>
      <p>$methodScope</p>
    </details>
  </main>
</body>
</html>
