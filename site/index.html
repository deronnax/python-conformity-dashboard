<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Conformity</title>
  <link rel="stylesheet" href="styles.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <h1 data-message="title">Python Conformity</h1>
        <p data-message="subtitle">Observed behavior of public standard library APIs.</p>
      </div>
      <div class="header-actions">
        <label class="language-control">
          <span data-message="language">Language</span>
          <select id="language">
            <option value="en" lang="en">English</option>
            <option value="fr" lang="fr">Français</option>
          </select>
        </label>
        <a class="download" href="results.json" data-message="download" download>Download results (JSON)</a>
      </div>
    </header>
    <p class="metadata" id="metadata"></p>

    <section class="comparison" data-label="comparison" aria-label="Comparison results">
      <div class="switch" role="group" data-label="suite" aria-label="Test suite">
        <button type="button" data-suite="common" data-message="commonTab" aria-pressed="true">Shared cases</button>
        <button type="button" data-suite="upstream" data-message="upstreamTab" aria-pressed="false">CPython tests</button>
      </div>
      <p id="description" class="description"></p>
      <div id="summaries" class="summaries" data-label="summaries" aria-label="Results by interpreter"></div>
      <div class="filters">
        <label><span data-message="module">Module</span> <select id="module"></select></label>
        <label class="only-differences"><input type="checkbox" id="only-differences"> <span data-message="onlyDifferences">Differences and unmeasured cases</span></label>
        <span id="count" role="status"></span>
      </div>
      <div class="table-scroll" role="region" data-label="caseTable" aria-label="Test case table" tabindex="0">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

    <details class="methodology">
      <summary data-message="methodology">Methodology and scope</summary>
      <p data-message="methodCases"></p>
      <p data-message="methodUpstream"></p>
      <p data-message="methodScope"></p>
    </details>
    <noscript>JavaScript is required to display and filter the table. The results are available as JSON.</noscript>
  </main>
  <script type="application/json" id="results"><!-- RESULTS --></script>
</body>
</html>
