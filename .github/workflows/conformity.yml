name: Python Conformity

# A measurement runs every Monday, since packages and wheels change without a
# push, and when the workflow is run by hand (on a branch, to try a change to the
# harness). It takes about an hour, most of it Django's test suite on the slower
# interpreters. Pushes and pull requests only run the unit tests and regenerate
# the pages from the published results. Only main publishes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # -e and -o pipefail

env:
  MEASURE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  # RustPython is built once, for every job that measures it.
  rustpython:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build RustPython
        run: |
          python3 fetch.py 3.11 rustpython-source
          cd runtimes/rustpython-source
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --release --locked --features freeze-stdlib,sqlite --bin rustpython
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustpython
          path: runtimes/rustpython-source/target/release/rustpython

  # Django's test suite, one job per interpreter of each Python version. The
  # interpreters of each version are listed in references.py.
  suite:
    name: Django on ${{ matrix.runtime }} (Python ${{ matrix.python }})
    needs: rustpython
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", runtime: cpython }
          - { python: "3.11", runtime: pypy }
          - { python: "3.11", runtime: graalpy }
          - { python: "3.11", runtime: rustpython }
          - { python: "3.11", runtime: freethreaded }
          - { python: "3.12", runtime: cpython }
          - { python: "3.12", runtime: pypy }
          - { python: "3.12", runtime: graalpy }
          - { python: "3.12", runtime: rustpython }
          - { python: "3.13", runtime: cpython }
          - { python: "3.13", runtime: graalpy }
          - { python: "3.13", runtime: rustpython }
          - { python: "3.14", runtime: cpython }
          - { python: "3.14", runtime: rustpython }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: matrix.runtime == 'rustpython'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustpython
          path: runtimes/rustpython/
      - name: Download the interpreter
        run: |
          if [ ${{ matrix.runtime }} = rustpython ]; then chmod +x runtimes/rustpython/rustpython
          else python3 fetch.py ${{ matrix.python }} ${{ matrix.runtime }}; fi
      - name: Run Django's test suite
        run: python3 -B test_suites.py --version ${{ matrix.python }} --runtime ${{ matrix.runtime }} --output suite.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-${{ matrix.python }}-${{ matrix.runtime }}
          path: suite.json

  dashboard:
    name: Python ${{ matrix.python }}
    needs: rustpython
    # Pushes and pull requests skip the RustPython build.
    if: ${{ !cancelled() && needs.rustpython.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default version is the site root. PyPy for Python 3.12 is a beta.
          - { python: "3.11", folder: "" }
          - { python: "3.12", folder: 3.12/ }
          - { python: "3.13", folder: 3.13/ }
          - { python: "3.14", folder: 3.14/ }
    env:
      PYTHON: runtimes/cpython/bin/python${{ matrix.python }}
      # The published dashboard of this version.
      PUBLISHED: https://${{ github.repository_owner }}.github.io/python-conformity-dashboard/${{ matrix.folder }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Regenerating the pages needs only CPython.
      - name: Download the interpreters
        run: |
          if $MEASURE; then python3 fetch.py ${{ matrix.python }}
          else python3 fetch.py ${{ matrix.python }} cpython; fi
      - if: env.MEASURE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustpython
          path: runtimes/rustpython/

      - name: Run the unit tests
        run: $PYTHON -B -m unittest discover -s tests

      # GitHub Pages replaces the whole site on each deployment, so the published
      # history is downloaded, extended by this run and published again.
      - name: Measure
        if: env.MEASURE == 'true'
        run: |
          chmod +x runtimes/rustpython/rustpython
          curl -fsSL "${PUBLISHED}history.json" -o history.json || echo "No published history yet."
          $PYTHON -B measure.py --reference ${{ matrix.python }} --history history.json --runtimes runtimes \
            --benchmarks --applications --packages | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the pages from the published results
        if: env.MEASURE == 'false'
        run: |
          curl -fsSL "${PUBLISHED}results.json" -o results.json || { echo "Not published yet."; exit 0; }
          curl -fsSL "${PUBLISHED}history.json" -o history.json
          $PYTHON -B dashboard.py results.json --history history.json --version ${{ matrix.python }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-${{ matrix.python }}
          path: dist/

  assemble:
    needs: [dashboard, suite]
    # A suite job that failed leaves its interpreter out of the comparison.
    if: ${{ !cancelled() && needs.dashboard.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dashboard-*
          path: parts/
      - if: env.MEASURE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-*
          path: parts/

      # The default version, 3.11, is the site root; the others are served from a
      # folder. A measurement adds the test suites to each version's results.
      - name: Put each version in its folder
        run: |
          for part in parts/dashboard-*; do
            version=${part#parts/dashboard-}
            folder=site/$version
            if [ $version = 3.11 ]; then folder=site; fi
            if $MEASURE; then
              python3 -B dashboard.py $part/results.json --history $part/history.json --version $version \
                --suites parts --output $folder
            else
              mv $part $folder  # 3.11 comes first and creates site/
            fi
          done

      # Python 3.11 used to be served under /3.11/, with a French page under fr/.
      - name: Redirect the former addresses
        run: |
          redirect() {  # folder, target
            mkdir -p "site/$1"
            echo "<!doctype html><meta http-equiv=refresh content=\"0; url=$2\"><script>location.replace('$2' + location.search + location.hash)</script>" > "site/$1/index.html"
          }
          redirect 3.11 ../
          redirect 3.11/fr ../../

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-conformity
          path: site/

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  publish:
    needs: assemble
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
