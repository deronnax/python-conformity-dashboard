name: Conformité Python

on:
  push:
    branches: [main]
  # Package releases and wheels change without a push, so the dashboard is
  # measured again every Monday.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Récupérer les interpréteurs précompilés
        shell: bash
        run: |
          set -euo pipefail
          runtimes="$RUNNER_TEMP/conformite"
          mkdir -p "$runtimes"
          cd "$runtimes"

          extract() {
            local hash="$1" url="$2" target="$3"
            shift 3
            curl -fLsS --retry 3 --max-time 120 "$@" "$url" -o runtime.tar.gz
            printf '%s  runtime.tar.gz\n' "$hash" | sha256sum --check
            mkdir -p "$target"
            tar -xzf runtime.tar.gz --strip-components=1 -C "$target"
            rm runtime.tar.gz
          }

          extract 7cc8d9dce9ea23c31267e7f244005c8979da04794b7737a3a30e62b03abeb120 \
            https://github.com/astral-sh/python-build-standalone/releases/download/20261021/cpython-3.11.17%2B20261021-x86_64-unknown-linux-gnu-install_only.tar.gz cpython
          extract 706965bcf372752ba69dafd59d860e51bc2fadbb0f8a47cec3426125d7058ceb \
            https://downloads.python.org/pypy/pypy3.11-v8.0.1-linux64.tar.gz pypy
          extract 94238f39f35e64f8703f29889999552ed86fc3d8644e3947ad9f30ef91525dcf \
            https://github.com/oracle/graalpython/releases/download/graal-25.5.5/graalpy3.13-community-25.5.5-linux-amd64.tar.gz graalpy
          extract bf290cf7a70f813758819d895868b2b49b9edea1f10de3524df2cae1f2d58a4d \
            https://github.com/RustPython/RustPython/archive/refs/tags/0.6.0.tar.gz rustpython-src

      - name: Tester le générateur et le harnais
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/conformite/cpython/bin/python3.11" -B -m unittest discover -s tests

      - name: Compiler RustPython avec SQLite
        shell: bash
        working-directory: ${{ runner.temp }}/conformite/rustpython-src
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --release --locked --features freeze-stdlib,sqlite --bin rustpython

      - name: Mesurer et générer le dashboard
        shell: bash
        run: |
          set -euo pipefail
          runtimes="$RUNNER_TEMP/conformite"
          curl -fLsS --retry 3 --max-time 120 https://www.python.org/ftp/python/3.11.17/Python-3.11.17.tar.xz \
            -o "$runtimes/Python-3.11.17.tar.xz"
          "$runtimes/cpython/bin/python3.11" -B measure.py \
            --pypy "$runtimes/pypy/bin/pypy3.11" \
            --rustpython "$runtimes/rustpython-src/target/release/rustpython" \
            --graalpy "$runtimes/graalpy/bin/graalpy" \
            --applications \
            --packages \
            --source "$runtimes/Python-3.11.17.tar.xz" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publier l’artefact du dashboard
        if: ${{ !cancelled() && hashFiles('dist/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-conformite
          path: dist/
          if-no-files-found: error

      - name: Préparer la publication GitHub Pages
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  publier:
    needs: mesure
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
